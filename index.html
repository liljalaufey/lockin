<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lock In – æfingaapp</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1514">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lock In">
<style>
:root{color-scheme:dark;--sand:#e3b968;--bg:#0f1514;--card:#18201f;--card2:#212b2a;--line:#2e3b3a;--tx:#e8eeec;--mut:#93a3a0;--ac:#2fc4a5;--ac2:#8be8cf;--warn:#f59e0b;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);font-weight:600}
button.ok{background:var(--ac2);border-color:var(--ac2);color:#04201a;font-weight:700}
button.dng{color:var(--red)}button.sm{padding:6px 10px;font-size:13px;border-radius:10px}
button.full{width:100%}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input[type=checkbox]{width:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1110;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr{display:flex;align-items:center;gap:12px}
.lvl{width:46px;height:46px;border-radius:14px;background:var(--sand);color:#2a2108;display:grid;place-items:center;font-weight:800;font-size:18px}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sets{display:grid;grid-template-columns:28px 1fr 64px 64px 40px;gap:6px;align-items:center;margin-top:6px}
.sets .h{font-size:11px;color:var(--mut);text-align:center}
.sets .n{text-align:center;color:var(--mut);font-weight:700}.sets .pv{font-size:12px;color:var(--mut);text-align:center}
.sets input{text-align:center;padding:8px 2px}
.chk{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:10px}
.chk.d{background:var(--ac2);border-color:var(--ac2);color:#04201a}
.done input{opacity:.65}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;color:var(--mut);background:var(--card2);padding:2px 8px;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.s{opacity:1}
.big{font-size:30px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}
svg.ch{width:100%;height:auto;display:block}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);cursor:pointer;user-select:none;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip.on{background:var(--ac);border-color:var(--ac)}
#rest{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:544px;margin:0 auto;z-index:6}
.restbar{background:#17332e;border:1px solid #2fc4a5;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.restbar .t{font-size:24px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.restbar .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--ac2)}
.pimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.thumb{width:64px;flex:none;cursor:pointer}.thumb svg{width:100%;height:auto;display:block}
.mus{font-size:12px;color:var(--mut)}
#trun{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;color:#fff;transition:background .2s}
#trun .tl{font-size:18px;letter-spacing:3px;font-weight:700;opacity:.85}
#trun .tt{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#trun .tn{font-size:26px;font-weight:700}
#trun .tb{width:min(50vw,210px);background:#0f1514;border-radius:16px;padding:8px}#trun .tb svg{width:100%;height:auto;display:block}
#trun .tprog{width:100%;height:6px;background:#ffffff30;border-radius:4px;overflow:hidden}#trun .tprog i{display:block;height:100%;background:#fff;width:0}
#trun.flash{animation:fl .6s 2}
@keyframes fl{0%,100%{filter:none}50%{filter:brightness(2)}}
button:disabled{opacity:.4}
button.pri,button.ok,.chip.on,.chk.d{background:linear-gradient(135deg,#3a9f8a,#1b4f44);border-color:#2b7a69;color:#e6f6f1}
button.dng{color:#b4bfbd;background:#1c2423;border-color:#2e3b3a}
button.gry{background:#2d3735;border-color:#3d4a48;color:#e8eeec}
#trun button{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.25);color:#fff}
#trun button.dng{background:rgba(0,0,0,.6);color:#d5dcdb}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-right:7px}
button:has(>.ic:last-child) .ic,.ic.r{margin-right:0;margin-left:7px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<div id="rest"></div>
<script>
const KEY='styrkur-v1';
/* ---- Æfingagrunnur: id|nafn|g (gull-hlutfall)|bw|áhöld|aðalvöðvi|aukavöðvar|stór æfing ---- */
const GRP={chest:'Brjóst',lats:'Bak',upback:'Bak',shoulders:'Axlir',biceps:'Handleggir',triceps:'Handleggir',quads:'Fætur',hams:'Fætur',glutes:'Fætur',calves:'Fætur',abs:'Kviður'};
const MU={chest:'Brjóst',lats:'Breiðir bakvöðvar',upback:'Efri bak og herðar',shoulders:'Axlir',biceps:'Biceps',triceps:'Triceps',quads:'Framanlæri',hams:'Aftanlæri',glutes:'Rass',calves:'Kálfar',abs:'Kviður'};
const EX=`bench|Bekkpressa|1|0|bb|chest|triceps,shoulders|1

dbrow|Róður með handlóð (hvor hönd)|0.4|0|db|lats|upback,biceps|1
invrow|Róður undir borði eða rá|1|1|bw|lats|upback,biceps|1
bandpull|Niðurtog með teygju|0.4|0|band|lats|biceps|0

row|Róður með stöng|0.9|0|bb|upback|lats,biceps|1
cablerow|Róður í tæki|0.9|0|mach|upback|lats,biceps|1
bandrow|Róður með teygju|0.4|0|band|upback|lats,biceps|0
facepull|Andlitstog|0.4|0|mach|upback|shoulders|0
revfly|Öfugt flug með handlóð (hvor hönd)|0.12|0|db|upback|shoulders|0
shrug|Axlayppur með stöng|1|0|bb|upback||0
dbshrug|Axlayppur með handlóðum (hvor hönd)|0.5|0|db|upback||0
superman|Supermann|1.2|1|bw|upback|glutes|0
birddog|Bird dog|1.2|1|bw|upback|abs,glutes|0
reversesnow|Öfugur snjóengill|1.2|1|bw|upback|shoulders|0
plank|Planki|1.3|1|tid|abs|shoulders|0
sideplank|Hliðarplanki|1.3|1|tid|abs||0
hollow|Hollow hold|1.3|1|tid|abs||0
flutter|Flutter kicks|1.3|1|tid|abs||0
bicycle|Hjólakviðkreppur|1.5|1|bw|abs||0
russian|Rússneskur snúningur|1.5|1|bw|abs||0
sumo|Sumo hnébeygja|1.5|1|bw|quads|glutes|1

jacks|Jumping jacks|1.5|1|tid|calves|shoulders|0
highknees|Hnélyftur|1.5|1|tid|quads|abs,calves|0
ohp|Axlapressa með stöng|0.65|0|bb|shoulders|triceps|1

machohp|Axlapressa í tæki|0.6|0|mach|shoulders|triceps|1
pike|Pike armbeygjur|1|1|bw|shoulders|triceps|1
lateral|Hliðarlyfta|0.15|0|db|shoulders||0
cablelateral|Hliðarlyfta í kaðli|0.12|0|mach|shoulders||0

tricext|Triceps yfir höfuð (handlóð)|0.3|0|db|triceps||0
diamond|Demantsarmbeygjur|1.2|1|bw|triceps|chest|1
benchdip|Dýfur á stól|1|1|bw|triceps|chest,shoulders|1
bandpushdown|Triceps með teygju|0.3|0|band|triceps||0
squat|Hnébeygja|1.4|0|bb|quads|glutes,hams|1
legpress|Fótapressa|2.5|0|mach|quads|glutes|1
goblet|Goblet hnébeygja|0.4|0|db|quads|glutes|1
bodysquat|Hnébeygja, líkamsþyngd|1.5|1|bw|quads|glutes|1
lunge|Framstig með handlóðum (hvor hönd)|0.35|0|db|quads|glutes|1
bwlunge|Framstig, líkamsþyngd|1.3|1|bw|quads|glutes|1
bulgarian|Búlgarskt split squat|1.3|1|bw|quads|glutes|1
jumpsquat|Hnébeygjustökk|1.4|1|bw|quads|glutes,calves|1
legext|Fótaréttur|0.9|0|mach|quads||0
rdl|Rúmensk réttstöðulyfta|1.3|0|bb|hams|glutes,upback|1
dbrdl|Rúmensk réttstöðulyfta með handlóðum (hvor hönd)|0.3|0|db|hams|glutes|1
sglrdl|Einfætt rúmensk réttstöðulyfta|1.2|1|bw|hams|glutes|1
legcurl|Fótabeygja|0.6|0|mach|hams||0
slidecurl|Hamstring-renna á gólfi|1|1|bw|hams|glutes|0
hipthrust|Mjaðmalyfta með stöng|1.5|0|bb|glutes|hams|1
dbthrust|Mjaðmalyfta með handlóð|0.6|0|db|glutes|hams|1
bridge|Rassabrú|1.5|1|bw|glutes|hams|1
sbridge|Einfætt rassabrú|1.2|1|bw|glutes|hams|0
donkey|Rassspark (donkey kick)|1|1|bw|glutes||0
cablekick|Rassspark í kaðli|0.2|0|mach|glutes||0
bandwalk|Hliðarganga með teygju|0.15|0|band|glutes||0
calf|Tábeygja í tæki|1.5|0|mach|calves||0
dbcalf|Tábeygja með handlóð (hvor hönd)|0.3|0|db|calves||0
bwcalf|Tábeygja, líkamsþyngd|1.6|1|bw|calves||0
crunch|Kviðkreppur|1.5|1|bw|abs||0
legraise|Fótalyftur í rá|1.2|1|bar|abs||0
lyingraise|Fótalyftur liggjandi|1.3|1|bw|abs||0
deadbug|Dead bug|1.3|1|bw|abs||0
mountain|Fjallaklifur|1.4|1|bw|abs||0
cablecrunch|Kviðkreppur í kaðli|0.6|0|mach|abs||0`.split('\n').map(l=>{const a=l.split('|');return{id:a[0],name:a[1],g:+a[2],bw:a[3]==='1',eq:a[4].split(','),p:a[5].split(','),s:a[6]?a[6].split(','):[],c:a[7]==='1',grp:GRP[a[5].split(',')[0]]}});

/* ---- Vöðvamynd (einfölduð, framan og aftan) ---- */
function body(p,s){
  p=p||[];s=s||[];
  const B='#26302f',fl=m=>p.includes(m)?'#2fc4a5':s.includes(m)?'#2fc4a580':'#2f3d3b';
  const half=front=>{
    let h=`<path d="M50 34 Q36 34 26 38 L28 70 Q30 90 33 104 L50 108 Z" fill="${B}"/>
    <ellipse cx="20" cy="60" rx="7.5" ry="19" transform="rotate(6 20 60)" fill="${B}"/>
    <ellipse cx="15" cy="92" rx="6" ry="17" transform="rotate(5 15 92)" fill="${B}"/>
    <ellipse cx="13" cy="114" rx="4" ry="6" fill="${B}"/>
    <ellipse cx="38" cy="135" rx="12.5" ry="31" fill="${B}"/>
    <ellipse cx="36" cy="185" rx="8.5" ry="24" fill="${B}"/>
    <ellipse cx="35" cy="216" rx="8" ry="4" fill="${B}"/>`;
    if(front)h+=`<ellipse cx="24" cy="42" rx="9" ry="8" fill="${fl('shoulders')}"/>
    <path d="M50 40 Q38 38 30 47 Q30 60 42 62 L50 60 Z" fill="${fl('chest')}"/>
    <ellipse cx="19" cy="62" rx="5.5" ry="11" transform="rotate(6 19 62)" fill="${fl('biceps')}"/>
    <rect x="42" y="64" width="8" height="38" rx="3" fill="${fl('abs')}"/>
    <ellipse cx="35" cy="82" rx="4.5" ry="14" fill="${fl('abs')}"/>
    <ellipse cx="38" cy="132" rx="10.5" ry="27" fill="${fl('quads')}"/>
    <ellipse cx="36" cy="186" rx="6" ry="19" fill="${fl('calves')}"/>`;
    else h+=`<ellipse cx="24" cy="42" rx="9" ry="8" fill="${fl('shoulders')}"/>
    <path d="M50 34 Q38 36 28 42 L36 62 L50 66 Z" fill="${fl('upback')}"/>
    <path d="M30 52 Q27 74 40 92 L50 88 L50 66 L38 62 Z" fill="${fl('lats')}"/>
    <ellipse cx="19" cy="62" rx="5.5" ry="11" transform="rotate(6 19 62)" fill="${fl('triceps')}"/>
    <path d="M43 90 L50 88 L50 106 L43 104 Z" fill="${fl('upback')}"/>
    <ellipse cx="40" cy="113" rx="11" ry="10" fill="${fl('glutes')}"/>
    <ellipse cx="38" cy="145" rx="10" ry="20" fill="${fl('hams')}"/>
    <ellipse cx="36" cy="188" rx="7" ry="19" fill="${fl('calves')}"/>`;
    return h;
  };
  const fig=front=>`<circle cx="50" cy="16" r="11" fill="${B}"/><rect x="45" y="26" width="10" height="10" fill="${B}"/>${half(front)}<g transform="translate(100 0) scale(-1 1)">${half(front)}</g>`;
  return `<svg viewBox="0 0 210 224" xmlns="http://www.w3.org/2000/svg">${fig(true)}<g transform="translate(110 0)">${fig(false)}</g></svg>`;
}
const exImg=ex=>ex.img?`<img class="pimg" src="${ex.img}" alt="">`:body(ex.p||[],ex.s||[]);
const thumb=ex=>`<div class="thumb" data-act="muscle" data-v="${ex.id}">${exImg(ex)}</div>`;
function muscTxt(ex){const a=ex.p.map(m=>MU[m]).join(', '),b=ex.s.map(m=>MU[m]).join(', ');return (a?'Aðal: '+a:'')+(b?' · Aukalega: '+b:'')}
function muscleModal(id){
  const ex=getEx(id);
  modal(`<div class="row"><h1 class="sp" style="margin:0">${esc(ex.name)}</h1><button class="sm" data-act="mclose2">Loka</button></div>
  ${ex.img?`<img class="pimg" src="${ex.img}" style="max-width:320px;margin:12px auto;aspect-ratio:auto" alt="">`:''}${ex.p.length?`<div style="max-width:320px;margin:12px auto 4px">${body(ex.p,ex.s)}</div><div class="mut" style="text-align:center;margin-bottom:12px">Framhlið · Bakhlið</div>`:''}
  <p><span class="badge" style="color:#2fc4a5;border-color:#2fc4a555">Aðal</span> ${ex.p.map(m=>MU[m]).join(', ')||'–'}</p>
  <p><span class="badge" style="color:#9be7d4;border-color:#9be7d455">Aukalega</span> ${ex.s.map(m=>MU[m]).join(', ')||'–'}</p>`);
}

/* ---- Hvíldartími ---- */
let RT=null,lastMode='',beepCtx=null;
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function beep(){
  try{beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)();if(beepCtx.state==='suspended')beepCtx.resume();
    const o=beepCtx.createOscillator(),g=beepCtx.createGain();o.connect(g);g.connect(beepCtx.destination);o.frequency.value=880;g.gain.value=.25;o.start();o.stop(beepCtx.currentTime+.4)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function startRest(){RT={end:Date.now()+S.rest*1000,dur:S.rest};try{beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}drawRest()}
function drawRest(){
  const el=$('#rest');if(!el)return;
  if(!S.active||tab!=='train'){if(el.innerHTML)el.innerHTML='';lastMode='';return}
  let left=0;
  if(RT){left=Math.ceil((RT.end-Date.now())/1000);if(left<=0){RT=null;beep();toast('Hvíld búin – næsta sett!')}}
  const mode=RT?'run':'idle';
  if(mode!==lastMode){
    el.innerHTML=mode==='run'
      ?`<div class="restbar"><button class="sm" data-act="restAdj" data-v="-15">−15</button><div class="t sp"></div><button class="sm" data-act="restAdj" data-v="15">+15</button><button class="sm pri" data-act="restSkip">Sleppa</button><div class="pg"></div></div>`

let G={place:'gym',days:3,focus:[],eq:['db','bb','bar','mach'],seed:0},GEN=null;
function generate(){
  const eq=G.eq,foc=G.focus;
  const sess=SPLIT[G.days].map(k=>({name:TPL[k][0],slots:TPL[k][1].map(m=>({m,f:foc.includes(m)}))}));
  sess.forEach(s=>foc.forEach(m=>{if(s.slots.some(x=>x.m===m))s.slots.push({m,f:true})}));
  if(G.days!==3)foc.forEach(m=>{let n=sess.filter(s=>s.slots.some(x=>x.m===m)).length;const need=Math.min(2,sess.length);
    for(let i=0;n<need&&i<sess.length;i++){if(!sess[i].slots.some(x=>x.m===m)){sess[i].slots.push({m,f:true});n++}}});
  sess.forEach(s=>{while(s.slots.length>8){let idx=-1;for(let i=s.slots.length-1;i>=0;i--)if(!s.slots[i].f){idx=i;break}if(idx<0)idx=s.slots.length-1;s.slots.splice(idx,1)}});
  const usedProg=new Set(),missing=new Set();
  sess.forEach((s,si)=>{
    const used=new Set(),cnt={},out=[];
    s.slots.forEach(sl=>{
      const no=cnt[sl.m]||0;cnt[sl.m]=no+1;
      let c=EX.filter(e=>e.p[0]===sl.m&&!used.has(e.id)&&e.eq.every(t=>t==='bw'||eq.includes(t)));
      if(!c.length){missing.add(sl.m);return}
      const fresh=c.filter(e=>!usedProg.has(e.id));if(fresh.length)c=fresh;
      const comp=c.filter(e=>e.c),iso=c.filter(e=>!e.c);
      const pool=no===0?(comp.length?comp:c):(iso.length?iso:c);
      const e=pool[(si+G.seed+no)%pool.length];
      used.add(e.id);usedProg.add(e.id);out.push(e);
    });
    out.sort((a,b)=>(b.c?1:0)-(a.c?1:0));
    s.ex=out;
  });
  return {sess,missing:[...missing]};
}

function overall(){const l=exScores().slice(0,5);if(!l.length)return null;return l.reduce((a,x)=>a+x.sc,0)/l.length}

/* ---- Æfing: aðgerðir ---- */
function recFor(ex){
  let n,r;
  if(ex.p[0]==='abs'||ex.p[0]==='calves'){n=3;r=15}
  else if(ex.c){n=ex.bw?3:4;r=ex.bw?(ex.eq.includes('bar')?8:10):8}
  else{n=3;r=12}
  const band=ex.eq.includes('band'),step=ex.eq.includes('db')?1:2.5;let w=0;
  if(!ex.bw&&!band){w=S.bw*ex.g*0.45/(1+r/30);w=Math.max(step,Math.round(w/step)*step)}
  return {n,r,w,step,fixed:ex.bw||band};
}
function mkItem(id){
  const ex=getEx(id),rec=recFor(ex),p=lastSets(id);
  if(p){
    let up=false;
    if(!rec.fixed&&p.length>=rec.n-1&&p.every(x=>x.r>=rec.r))up=true;
    return {ex:id,note:up?'Þyngt um '+rec.step+' kg – þú kláraðir allt síðast':'',sets:p.map(x=>({w:up?r1(x.w+rec.step):x.w,r:x.r,done:false}))};
  }
  return {ex:id,note:'Tillaga: '+rec.n+'×'+rec.r+(rec.fixed?'':' · '+rec.w+' kg')+' – breyttu ef þarf',sets:Array.from({length:rec.n},()=>({w:rec.w,r:rec.r,done:false}))};
}
function startW(name,ids){S.active={name,start:Date.now(),items:ids.map(mkItem)};save();tab='train';render()}
function finishW(){
  const a=S.active,items=[];
  a.items.forEach(it=>{const ex=getEx(it.ex);const sets=it.sets.filter(s=>s.done&&valid(ex,s));if(sets.length)items.push({ex:it.ex,sets})});
  if(!items.length){toast('Hakaðu við að minnsta kosti eitt sett ✓');return}
  const w={id:uid(),name:a.name,date:Date.now(),dur:Math.max(1,Math.round((Date.now()-a.start)/60000)),items};
  const prs=[];let xp=0,sets=0;
  items.forEach(it=>{const ex=getEx(it.ex),before=bestE(it.ex),now=bestE(it.ex,[w]);if(before>0&&now>before)prs.push(ex.name);it.sets.forEach(s=>{xp+=setXp(ex,s);sets++})});
  const lvB=lvlOf(totalXp());S.workouts.push(w);S.active=null;RT=null;save();
  const lvA=lvlOf(totalXp());tab='train';render();
  modal(`<div style="text-align:center"><div class="big">Vel gert!</div><div style="font-weight:700;color:var(--ac2);margin:2px 0 6px">${ic('check')}Locked in</div><p>${sets} sett · +${xp} XP</p>${lvA>lvB?`<p><b>Nýtt level: ${lvA}!</b></p>`:''}${prs.length?`<div class="card"><b style="color:var(--sand)">${ic('trophy')}Ný met</b><div class="mut" style="margin-top:4px">${prs.map(esc).join(', ')}</div></div>`:''}<button class="pri full" data-act="mclose2">Áfram</button></div>`);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,v=t.dataset.v,i=+t.dataset.i,j=+t.dataset.s;
  if(act==='mclose'){if(e.target===t)closeM();return}
  if(t.tagName==='SELECT'||t.tagName==='INPUT'||t.tagName==='TEXTAREA')return;
  if(act==='tab'){tab=v;render();window.scrollTo(0,0)}
  else if(act==='mclose2')closeM();
  else if(act==='startEmpty')startW('Æfing',[]);
  else if(act==='startPlan'){const p=S.plans.find(x=>x.id===v);if(S.active){ask('Þú ert með æfingu í gangi. Hætta við hana og byrja þessa?',()=>startW(p.name,p.ex),'Já, byrja nýja');return}startW(p.name,p.ex)}
  else if(act==='pickEx')exPicker('active');
  else if(act==='swapItem'){swapI=i;exPicker('swap')}
  else if(act==='pickDone'){
    if(pickMode==='planadd'){PE.ex.push(...pickSel);editPlanModal();return}
    if(pickMode==='swap'){if(!pickSel.length){toast('Veldu æfingu');return}if(S.active)S.active.items[swapI]=mkItem(pickSel[0])}
    else if(pickMode==='timed'){pickSel.forEach(id=>S.tcfg.ex.push(id));delete S.tcfg.pre}else if(S.active)pickSel.forEach(id=>S.active.items.push(mkItem(id)));
    save();closeM();render()}
  else if(act==='newExP'){const q=$('#q')?$('#q').value.trim():'';const pn=$('#pn');if(pn)pickName=pn.value;exFromPick=true;newExModal(q)}
  else if(act==='editPlan'){const p=S.plans.find(x=>x.id===v);PE={id:p.id,name:p.name,ex:p.ex.slice()};editPlanModal()}
  else if(act==='peUp'||act==='peDn'){const k=+v,d=act==='peUp'?-1:1;PE.name=$('#pn').value;[PE.ex[k],PE.ex[k+d]]=[PE.ex[k+d],PE.ex[k]];editPlanModal()}
  else if(act==='peDel'){PE.name=$('#pn').value;PE.ex.splice(+v,1);editPlanModal()}
  else if(act==='peAdd'){PE.name=$('#pn').value;exPicker('planadd')}
  else if(act==='peSave'){const n=$('#pn').value.trim();if(!n||!PE.ex.length){toast('Settu nafn og að minnsta kosti eina æfingu');return}const p=S.plans.find(x=>x.id===PE.id);p.name=n;p.ex=PE.ex.slice();save();closeM();render();toast('Áætlun vistuð ✓')}
  else if(act==='delItem'){S.active.items.splice(i,1);save();render()}
  else if(act==='addSet'){const s=S.active.items[i].sets,l=s[s.length-1]||{w:0,r:0};s.push({w:l.w,r:l.r,done:false});save();render()}
  else if(act==='delSet'){S.active.items[i].sets.pop();save();render()}
  else if(act==='chk'){
    const it=S.active.items[i],s=it.sets[j],ex=getEx(it.ex);
    if(!s.done){
      if(!s.w&&!s.r){const p=(lastSets(it.ex)||[])[j];if(p){s.w=p.w;s.r=p.r}}
      if(!valid(ex,s)){toast('Settu inn endurtekningar'+(ex.bw?'':' og kg'));render();return}
      const before=Math.max(bestE(it.ex),...it.sets.filter((x,k)=>k!==j&&x.done&&valid(ex,x)).map(x=>e1rm(ex,x.w,x.r)),0);
      s.done=true;const e=e1rm(ex,s.w,s.r);
      toast(before>0&&e>before?'Nýtt met! +'+setXp(ex,s)+' XP':'+'+setXp(ex,s)+' XP');
    }else s.done=false;
    save();render();if(s.done&&S.autoRest)startRest();
  }
  else if(act==='cancelW'){ask('Hætta við þessa æfingu?',()=>{S.active=null;RT=null;save();render()})}
  else if(act==='finishW')finishW();
  else if(act==='delW'){ask('Eyða þessari æfingu?',()=>{S.workouts=S.workouts.filter(w=>w.id!==v);save();render()})}
  else if(act==='newPlan')newPlanModal();
  else if(act==='planSave'){const n=$('#pn').value.trim();if(!n||!pickSel.length){toast('Settu nafn og veldu æfingar');return}S.plans.push({id:uid(),name:n,ex:pickSel.slice()});save();closeM();render()}
  else if(act==='delPlan'){ask('Eyða áætlun?',()=>{S.plans=S.plans.filter(p=>p.id!==v);save();render()})}
  else if(act==='newEx'){exFromPick=false;newExModal()}
  else if(act==='exSave'){const n=$('#xn').value.trim();if(!n){toast('Vantar nafn');return}const m=$('#xg').value,id='c'+uid();S.custom.push({id,name:n,grp:GRP[m]||'Annað',g:1,bw:$('#xb').checked,eq:['bw'],p:m?[m]:[],s:[],c:false,img:xImg||undefined});save();
    if(exFromPick){exFromPick=false;const md=pickMode;if(md==='swap')pickSel=[id];else pickSel.push(id);
      if(md==='plan')newPlanModal(true,pickName);else exPicker(md,true);
      const l=$('#plist');if(l)drawPick('');toast('Æfing búin til ✓')}
    else{closeM();render()}}
  else if(act==='delEx'){ask('Eyða æfingu úr listanum?',()=>{S.custom=S.custom.filter(e=>e.id!==v);save();render()})}
  else if(act==='askNo'){askCb=null;closeM()}
  else if(act==='askYes'){const cb=askCb;askCb=null;closeM();if(cb)cb()}
  else if(act==='tPre'){const p=TPRE[+v];S.tcfg={ex:tRoll(+v),work:p.work,rest:p.rest,rounds:p.rounds,name:p.name,pre:+v};save();render()}
  else if(act==='tShuf'){S.tcfg.ex=tRoll(S.tcfg.pre);save();render()}
  else if(act==='tDel'){S.tcfg.ex.splice(+v,1);delete S.tcfg.pre;save();render()}
  else if(act==='tAdd')exPicker('timed');
  else if(act==='tAdj'){const [k,d]=v.split(':'),lim={work:[5,300],rest:[0,180],rounds:[1,10]}[k];S.tcfg[k]=Math.min(lim[1],Math.max(lim[0],S.tcfg[k]+num(d)));save();render()}
  else if(act==='tStart'){if(S.tcfg.ex.length)tStart()}
  else if(act==='tPause')tPause();
  else if(act==='tSkip'){if(TR)tNext(false)}
  else if(act==='tQuit')ask('Hætta við tímaæfinguna?',()=>tStop());
  else if(act==='tDelW')ask('Eyða þessari tímaæfingu?',()=>{S.tworkouts=S.tworkouts.filter(t=>t.id!==v);save();render()});
  else if(act==='muscle')muscleModal(v);
  else if(act==='restGo')startRest();
  else if(act==='restSkip'){RT=null;lastMode='';drawRest()}
  else if(act==='restAdj'&&RT){RT.end+=num(v)*1000;RT.dur=Math.max(15,RT.dur+num(v));drawRest()}
  else if(act==='restS'){S.rest=Math.min(600,Math.max(15,S.rest+num(v)));save();drawRest()}
  else if(act==='genOpen')genModal();
  else if(act==='gPlace'){G.place=v;G.eq=v==='gym'?['db','bb','bar','mach']:[];genModal()}
  else if(act==='gDays'){G.days=+v;genModal()}
  else if(act==='gFocus'){G.focus=v==='all'?[]:G.focus.includes(v)?G.focus.filter(x=>x!==v):G.focus.concat(v);genModal()}
  else if(act==='gEq'){G.eq=G.eq.includes(v)?G.eq.filter(x=>x!==v):G.eq.concat(v);genModal()}
  else if(act==='gMake'){G.seed=0;genPreview()}
  else if(act==='gShuffle'){G.seed++;genPreview()}
  else if(act==='gBack')genModal();
  else if(act==='gSave')genSave();
  else if(act==='delProg'){ask('Eyða öllu prógramminu?',()=>{S.plans=S.plans.filter(p=>p.prog!==v);save();render()})}
  else if(act==='bkCopy'){const txt=JSON.stringify(S);const ta=$('#bk');ta.value=txt;ta.select();try{navigator.clipboard.writeText(txt).then(()=>toast('Afritað!'),()=>toast('Merktu textann og afritaðu'))}catch(x){toast('Merktu textann og afritaðu')}}
  else if(act==='bkLoad'){try{const d=JSON.parse($('#bk').value);if(!d||!Array.isArray(d.workouts))throw 0;ask('Þetta skiptir út núverandi gögnum. Halda áfram?',()=>{S=Object.assign(def(),d);save();render();toast('Gögn hlaðin inn')})}catch(x){toast('Ógilt afrit')}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&S.active){const s=S.active.items[+t.dataset.i].sets[+t.dataset.s];s[t.dataset.f]=num(t.value);save()}
  else if(t.dataset.act==='setName'){S.name=t.value;save()}
  else if(t.dataset.act==='setBw'){const b=num(t.value);if(b>20&&b<300){S.bw=b;save()}}
  else if(t.id==='q')drawPick(t.value);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='xp'&&t.files[0]){$('#xpl').textContent='Hleð mynd…';readImg(t.files[0],d=>{xImg=d;$('#xpv').innerHTML=`<img class="pimg" src="${d}" style="max-width:220px;margin:6px auto;aspect-ratio:auto">`;$('#xpl').textContent='Skipta um mynd'})}
  else if(t.dataset.pick){const id=t.dataset.pick;if(pickMode==='swap')pickSel=[id];else pickSel=t.checked?pickSel.concat(id):pickSel.filter(x=>x!==id)}
  else if(t.dataset.act==='pgEx'){pgEx=t.value;render()}
  else if(t.dataset.act==='setBw')render();
  else if(t.dataset.act==='autoRest'){S.autoRest=t.checked;save()}
});
setInterval(()=>{if(S.active&&tab==='train'&&!document.activeElement.matches('input')&&!$('#modal').innerHTML)render()},60000);
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
